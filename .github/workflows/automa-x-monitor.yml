name: AUTOMA X production monitor

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automa-x-production-monitor
  cancel-in-progress: true

jobs:
  code-tests:
    name: Code and workflow tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall -q app
      - name: Run automated tests
        run: python -m unittest discover -s tests -v

  api-monitor:
    name: Production API availability
    runs-on: ubuntu-latest
    steps:
      - name: Check API response
        run: |
          set -euo pipefail
          CODE=""
          for attempt in 1 2 3; do
            echo "Health check attempt $attempt/3 (allowing cold start)..."
            CODE=$(curl --silent --show-error --output /tmp/health.txt --write-out "%{http_code}" --connect-timeout 15 --max-time 100 https://automa-x-api.onrender.com/health || true)
            if [ "$CODE" = "200" ]; then break; fi
            sleep 10
          done
          echo "HTTP status: ${CODE:-no response}"
          if [ "$CODE" = "200" ]; then
            echo "Authenticated API health endpoint returned 200."
          else
            echo "::error::Authenticated API health check failed after retries."
            cat /tmp/health.txt || true
            exit 1
          fi

  render-deploy-status:
    name: Render latest deployment status
    runs-on: ubuntu-latest
    steps:
      - name: Check latest Render deployment when API key is configured
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$RENDER_API_KEY" ]; then
            echo "::warning::RENDER_API_KEY is not configured. Render deployment state cannot be verified from this workflow."
            exit 0
          fi
            RESPONSE=$(curl --fail --silent --show-error --max-time 20 -H "Authorization: Bearer $RENDER_API_KEY" "https://api.render.com/v1/services/srv-dbjo890473hc73aetda0/deploys?limit=5")
          STATUS=$(printf '%s' "$RESPONSE" | python -c 'import json,sys; d=json.load(sys.stdin); item=d[0] if isinstance(d,list) and d else {}; deploy=item.get("deploy", item); print((deploy.get("status") or "") if isinstance(deploy,dict) else "")')
          echo "Latest Render deployment status: ${STATUS:-unknown}"
          if [ "$STATUS" != "live" ]; then
            echo "::warning::Latest Render deployment is $STATUS; live production smoke job will wait for the matching commit."
          fi

  production-validation-boundaries:
    name: Production validation boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Report checks that still require safe live validation
        run: |
          echo "## AUTOMA X production validation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Code compilation and automated tests: executed by the code-tests job." >> "$GITHUB_STEP_SUMMARY"
          echo "- API availability: checked by the api-monitor job." >> "$GITHUB_STEP_SUMMARY"
          echo "- Render deployment state: checked only when RENDER_API_KEY is configured." >> "$GITHUB_STEP_SUMMARY"
          echo "- Live Groq generation, real five-bot workflow, and persistent task/approval storage: NOT certified by mocked unit tests or a health request." >> "$GITHUB_STEP_SUMMARY"
          echo "- SQLite on a Render Free web service is ephemeral. Configure DATABASE_URL to a durable PostgreSQL provider before claiming restart persistence." >> "$GITHUB_STEP_SUMMARY"
          echo "- Do not mark the five bots production-ready until dedicated authenticated live tests pass." >> "$GITHUB_STEP_SUMMARY"


  live-production-smoke:
    if: github.event_name == 'workflow_dispatch'
    name: Live Groq, five bots, task and approval readback
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Wait for this commit to become the latest live Render deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$RENDER_API_KEY" ]; then
            echo "::error::RENDER_API_KEY is required to wait for the production deploy before smoke testing."
            exit 1
          fi
          for attempt in $(seq 1 30); do
            RESPONSE=$(curl --fail --silent --show-error --max-time 20 -H "Authorization: Bearer $RENDER_API_KEY" "https://api.render.com/v1/services/srv-dbjo890473hc73aetda0/deploys?limit=5")
            MATCH=$(printf '%s' "$RESPONSE" | GITHUB_SHA="$GITHUB_SHA" python -c 'import json,os,sys; data=json.load(sys.stdin); items=[x.get("deploy",x) for x in data] if isinstance(data,list) else []; d=next((x for x in items if x.get("commit",{}).get("id")==os.environ["GITHUB_SHA"]),{}); print(d.get("status",""))')
            echo "Render deployment for this commit: ${MATCH:-not found} (attempt $attempt/30)"
            if [ "$MATCH" = "live" ]; then exit 0; fi
            if [ "$MATCH" = "build_failed" ] || [ "$MATCH" = "update_failed" ] || [ "$MATCH" = "canceled" ]; then
              echo "::error::Render deployment failed with status $MATCH."
              exit 1
            fi
            sleep 20
          done
          echo "::error::Timed out waiting for this commit to become live on Render."
          exit 1
      - name: Run production smoke test (creates one labeled test task and approval; no publishing)
        env:
          API_ACCESS_TOKEN: ${{ secrets.API_ACCESS_TOKEN }}
          AUTOMA_X_API_URL: https://automa-x-api.onrender.com
        run: |
          set -euo pipefail
          if [ -z "$API_ACCESS_TOKEN" ]; then
            echo "::error::Configure API_ACCESS_TOKEN in GitHub Actions secrets before running the live test."
            exit 1
          fi
          python tests/live_production_smoke.py

  alert-on-failure:
    name: Alert on monitor failure
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    steps:
      - name: Open or update monitoring incident
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[AUTOMA X] Falha no monitoramento de produção";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Uma verificação automática falhou.\n\nExecução: ${runUrl}\nCommit: ${context.sha}\nHorário: ${new Date().toISOString()}\n\nVerifique os jobs que falharam antes de considerar a produção saudável.`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
